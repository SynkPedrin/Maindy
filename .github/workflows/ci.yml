name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maindy
          POSTGRES_PASSWORD: maindy_dev
          POSTGRES_DB: maindy_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U maindy" --health-interval 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://maindy:maindy_dev@127.0.0.1:5433/maindy_test
      TEST_DATABASE_URL: postgres://maindy:maindy_dev@127.0.0.1:5433/maindy_test
      SMTP_URL: smtp://127.0.0.1:1025
      WEB_PUBLIC_URL: http://localhost:3100
      SESSION_SECRET: ci-only-not-secret-0000000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm turbo run build --filter=!@maindy/desktop
      - name: Typecheck
        run: pnpm turbo run typecheck --filter=!@maindy/desktop
      - name: Unit & integration tests
        run: pnpm turbo run test --filter=!@maindy/desktop --filter=!@maindy/web
